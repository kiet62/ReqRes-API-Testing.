
name: ReqRes Performance Monitoring

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman

      - name: Monitor ReqRes API
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run ReqRes.postman_collection.json \
            --folder "Monitor API Performance" \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "apiKey=$REQRES_API_KEY" \
            --reporters cli
